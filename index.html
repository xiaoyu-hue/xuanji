<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>玄机 · 今日</title>
<style>
  :root{
    --paper:#f7f1e5; --paper2:#efe6d3; --ink:#2e2a26; --ink2:#6f6659;
    --cinnabar:#a63d2f; --cinnabar2:#c0532f; --gold:#b8862f; --jade:#3f6f5f;
    --card:#fffdf7; --line:#e3d7bf; --shadow:0 6px 24px rgba(84,64,32,.10);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{background:var(--paper);color:var(--ink);
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    padding:20px 14px 40px;max-width:560px;margin:0 auto}
  .serif{font-family:"Noto Serif SC","Songti SC","STSong",serif}
  header{text-align:center;padding:14px 0 6px}
  header .seal{display:inline-block;background:var(--cinnabar);color:#fff;
    font-size:13px;letter-spacing:4px;padding:5px 10px 5px 14px;border-radius:4px}
  header h1{font-size:34px;letter-spacing:10px;margin:12px 0 2px;font-weight:600}
  header p{color:var(--ink2);font-size:13px;letter-spacing:2px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
    box-shadow:var(--shadow);padding:18px 16px;margin-top:16px}
  .card h2{font-size:17px;letter-spacing:3px;display:flex;align-items:center;gap:8px}
  .card h2::before{content:"";width:4px;height:16px;background:var(--cinnabar);border-radius:2px}
  .card h2 .sub{margin-left:auto;font-size:12px;color:var(--ink2);letter-spacing:1px}
  .bigday{text-align:center;padding:10px 0 2px}
  .bigday .lunar{font-size:30px;font-weight:600;letter-spacing:2px}
  .bigday .gz{color:var(--ink2);font-size:14px;margin-top:6px;letter-spacing:1px}
  .yiji{display:flex;gap:10px;margin-top:14px}
  .yiji .box{flex:1;border-radius:10px;padding:10px 12px;font-size:13.5px;line-height:1.9}
  .yi{background:#f2f7f1;border:1px solid #cfdfc9}
  .ji{background:#faf0ec;border:1px solid #e8cabd}
  .yiji b{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;color:#fff;margin-bottom:4px}
  .yi b{background:var(--jade)} .ji b{background:var(--cinnabar)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin-top:14px;font-size:13.5px}
  .grid div{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:5px 0}
  .grid span{color:var(--ink2)}
  .pengzu{margin-top:12px;font-size:12.5px;color:var(--ink2);line-height:1.8;text-align:center}
  .btn{display:block;width:100%;border:none;cursor:pointer;background:var(--cinnabar);color:#fff;
    font-size:16px;letter-spacing:4px;padding:13px 0;border-radius:10px;margin-top:14px;
    font-family:inherit;transition:transform .08s, background .2s}
  .btn:active{transform:scale(.98);background:var(--cinnabar2)}
  .btn.ghost{background:transparent;color:var(--cinnabar);border:1px solid var(--cinnabar)}
  .qian{text-align:center;padding-top:8px}
  .qian .grade{display:inline-block;border:1px solid var(--gold);color:var(--gold);
    padding:3px 14px;border-radius:99px;font-size:13px;letter-spacing:3px}
  .qian .poem{font-size:19px;line-height:2.1;letter-spacing:3px;margin:12px 0 6px}
  .qian .jie{font-size:13.5px;color:var(--ink2);line-height:1.8}
  .hidden{display:none}
  .answer{text-align:center;font-size:20px;line-height:1.9;padding:16px 6px 4px;letter-spacing:1px}
  .signs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
  .signs button{border:1px solid var(--line);background:var(--paper);border-radius:9px;
    padding:9px 0;font-size:13.5px;cursor:pointer;font-family:inherit;color:var(--ink)}
  .signs button.on{background:var(--cinnabar);color:#fff;border-color:var(--cinnabar)}
  .scores{margin-top:14px}
  .scores .row{display:flex;align-items:center;gap:10px;font-size:13.5px;margin:7px 0}
  .scores .row label{width:34px;color:var(--ink2)}
  .bar{flex:1;height:8px;background:var(--paper2);border-radius:99px;overflow:hidden}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--cinnabar2));border-radius:99px}
  .scores .row b{width:26px;text-align:right}
  .lucky{margin-top:10px;font-size:13.5px;color:var(--ink2);line-height:1.9;text-align:center}
  .lucky em{color:var(--cinnabar);font-style:normal}
  footer{text-align:center;color:var(--ink2);font-size:12px;margin-top:26px;line-height:2;letter-spacing:1px}
  #loading{text-align:center;color:var(--ink2);padding:60px 0;letter-spacing:3px}
  .daterow{display:flex;gap:8px;align-items:center;margin-top:12px}
  .daterow input{flex:1;border:1px solid var(--line);background:var(--paper);border-radius:9px;
    padding:9px 10px;font-size:14px;font-family:inherit;color:var(--ink)}
  .daterow button{border:1px solid var(--cinnabar);background:transparent;color:var(--cinnabar);
    border-radius:9px;padding:9px 14px;font-size:13px;cursor:pointer;font-family:inherit;white-space:nowrap}
  .shareout{margin-top:12px;text-align:center}
  .shareout img{max-width:100%;border-radius:10px;border:1px solid var(--line);box-shadow:var(--shadow)}
  .shareout a{display:inline-block;margin-top:8px;color:var(--cinnabar);font-size:13px}
  .shareout p{font-size:12px;color:var(--ink2);margin-top:4px}
  .bzform{display:flex;flex-direction:column;gap:8px;margin-top:12px}
  .bzform .row2{display:flex;gap:8px}
  .bzform input{flex:1;border:1px solid var(--line);background:var(--paper);border-radius:9px;
    padding:9px 10px;font-size:14px;font-family:inherit;color:var(--ink);min-width:0}
  .gender{display:flex;gap:8px}
  .gender button{flex:1;border:1px solid var(--line);background:var(--paper);border-radius:9px;
    padding:9px 0;font-size:14px;cursor:pointer;font-family:inherit;color:var(--ink)}
  .gender button.on{background:var(--cinnabar);color:#fff;border-color:var(--cinnabar)}
  .pillars{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px;text-align:center}
  .pillar{border:1px solid var(--line);border-radius:10px;padding:10px 4px;background:var(--paper)}
  .pillar.day{border-color:var(--gold);background:#fdf6e3}
  .pillar .pname{font-size:12px;color:var(--ink2);letter-spacing:1px}
  .pillar .ss{font-size:11px;color:var(--cinnabar);margin-top:2px;min-height:14px}
  .pillar .gzchar{font-size:30px;font-weight:600;line-height:1.3}
  .pillar .hide{font-size:11.5px;color:var(--ink2);margin-top:4px;line-height:1.7}
  .bzmeta{text-align:center;font-size:13.5px;color:var(--ink2);line-height:1.9;margin-top:12px}
  .bzmeta em{color:var(--cinnabar);font-style:normal}
  .dayun{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;margin-top:4px}
  .dayun .dy{flex:0 0 auto;border:1px solid var(--line);border-radius:10px;background:var(--paper);
    padding:8px 12px;text-align:center}
  .dayun .dy b{font-size:17px;display:block;letter-spacing:2px}
  .dayun .dy span{font-size:11px;color:var(--ink2);line-height:1.5;display:block}
  .fade{animation:fade .5s ease both}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<header>
  <span class="seal serif">民俗 · 娱乐</span>
  <h1 class="serif">玄 机</h1>
  <p id="todayLine">正在起卦…</p>
</header>

<div id="loading">🏮 正在翻开黄历…</div>

<main id="app" class="hidden">
  <!-- 今日黄历 -->
  <section class="card">
    <h2><span id="almTitle">今日黄历</span> <span class="sub" id="almSolar"></span></h2>
    <div class="daterow">
      <input type="date" id="datePick" min="1900-01-01" max="2100-12-31">
      <button id="btnToday">回到今天</button>
    </div>
    <div class="bigday">
      <div class="lunar serif" id="almLunar"></div>
      <div class="gz" id="almGz"></div>
    </div>
    <div class="yiji">
      <div class="box yi"><b>宜</b><div id="almYi"></div></div>
      <div class="box ji"><b>忌</b><div id="almJi"></div></div>
    </div>
    <div class="grid" id="almGrid"></div>
    <div class="pengzu" id="almPengzu"></div>
    <button class="btn ghost serif" id="btnShareAlm">生 成 黄 历 图</button>
    <div class="shareout hidden" id="shareAlm"></div>
  </section>

  <!-- 今日一签 -->
  <section class="card">
    <h2>今日一签 <span class="sub">同一天 · 同一签</span></h2>
    <div id="qianBefore">
      <p style="text-align:center;color:var(--ink2);font-size:13.5px;margin-top:10px">静心片刻，抽取属于今天的这一签</p>
      <button class="btn serif" id="btnQian">抽 今 日 签</button>
    </div>
    <div id="qianAfter" class="qian hidden">
      <span class="grade serif" id="qGrade"></span>
      <div class="poem serif" id="qPoem"></div>
      <div class="jie" id="qJie"></div>
      <button class="btn ghost serif" id="btnShareQian">生 成 签 文 图</button>
      <div class="shareout hidden" id="shareQian"></div>
    </div>
  </section>

  <!-- 答案之书 -->
  <section class="card">
    <h2>答案之书 <span class="sub">想好一个问题再翻开</span></h2>
    <div id="ansBox" class="answer serif hidden"></div>
    <button class="btn serif" id="btnAns">翻 开 答 案</button>
  </section>

  <!-- 星座运势 -->
  <section class="card">
    <h2>星座运势 <span class="sub">点你的星座</span></h2>
    <div class="signs" id="signGrid"></div>
    <div id="fortuneBox" class="hidden">
      <div class="scores" id="fScores"></div>
      <div class="lucky" id="fLucky"></div>
    </div>
  </section>

  <!-- 八字排盘 -->
  <section class="card">
    <h2>八字排盘 <span class="sub">输入出生时间</span></h2>
    <div class="bzform">
      <div class="row2">
        <input type="date" id="bzDate" min="1900-01-01" max="2100-12-31">
        <input type="time" id="bzTime" value="12:00">
      </div>
      <div class="gender" id="bzGender">
        <button data-g="1" class="on">男</button>
        <button data-g="0">女</button>
      </div>
      <button class="btn serif" id="btnBazi" style="margin-top:2px">排 盘</button>
    </div>
    <div id="baziBox" class="hidden">
      <div class="pillars" id="bzPillars"></div>
      <div class="bzmeta" id="bzMeta"></div>
      <div class="scores" id="bzWx"></div>
      <div class="bzmeta" id="bzYun"></div>
      <div class="dayun" id="bzDayun"></div>
      <p style="font-size:12px;color:var(--ink2);text-align:center;margin-top:2px">八字属传统民俗文化内容，仅供娱乐参考</p>
    </div>
  </section>
</main>

<footer>
  玄机 · 民俗文化娱乐，不作决策依据<br>
  历法核心由 Rust 计算，结果与经典黄历库逐项核对
</footer>

<script type="module">
import init, { almanac_json, daily_qian_json, book_answer, zodiac_index, zodiac_name, fortune_json, bazi_json }
  from './pkg/xuanji_web.js?v=2.0.0';

const now = new Date();
const Y = now.getFullYear(), M = now.getMonth() + 1, D = now.getDate();
const week = ['日','一','二','三','四','五','六'][now.getDay()];

async function main(){
  await init('./pkg/xuanji_web_bg.wasm?v=2.0.0');
  document.getElementById('todayLine').textContent =
    `${Y} 年 ${M} 月 ${D} 日 · 星期${week}`;
  document.getElementById('loading').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');

  // 黄历（可查任意日期）
  const pad = n => String(n).padStart(2, '0');
  let almData = null, almYMD = [Y, M, D];
  const renderAlmanac = (y, m, d) => {
    almYMD = [y, m, d];
    const a = JSON.parse(almanac_json(y, m, d));
    almData = a;
    const isToday = (y === Y && m === M && d === D);
    almTitle.textContent = isToday ? '今日黄历' : '黄历查询';
    almSolar.textContent = a.solar.replaceAll('-', ' / ');
    almLunar.textContent = a.lunar_text;
    almGz.textContent = `${a.year_ganzhi}年 · ${a.month_ganzhi}月 · ${a.day_ganzhi}日 · 属${a.shengxiao}`;
    almYi.textContent = a.yi.join(' · ');
    almJi.textContent = a.ji.join(' · ');
    const rows = [
      ['值神', `${a.tianshen}（${a.tianshen_luck}）`], ['星宿', `${a.xiu}（${a.xiu_luck}）`],
      ['冲煞', `冲${a.chong} · 煞${a.sha}`], ['节气', `${a.prev_jieqi} → ${a.next_jieqi}`],
      ['财神位', a.cai], ['喜神位', a.xi], ['福神位', a.fu], ['星座', a.xingzuo + '座'],
    ];
    almGrid.innerHTML = rows.map(([k,v]) => `<div><span>${k}</span><b>${v}</b></div>`).join('');
    almPengzu.textContent = `彭祖百忌：${a.pengzu_gan} · ${a.pengzu_zhi}`;
  };
  datePick.value = `${Y}-${pad(M)}-${pad(D)}`;
  datePick.onchange = () => {
    if (!datePick.value) return;
    const [y, m, d] = datePick.value.split('-').map(Number);
    renderAlmanac(y, m, d);
  };
  btnToday.onclick = () => { datePick.value = `${Y}-${pad(M)}-${pad(D)}`; renderAlmanac(Y, M, D); };
  renderAlmanac(Y, M, D);

  // 今日一签
  let lastQian = null;
  btnQian.onclick = () => {
    const q = JSON.parse(daily_qian_json(Y, M, D));
    lastQian = q;
    qGrade.textContent = `第 ${q.id} 签 · ${q.grade}`;
    qPoem.innerHTML = q.poem.join('<br>');
    qJie.textContent = '解签：' + q.jie;
    qianBefore.classList.add('hidden');
    qianAfter.classList.remove('hidden');
    qianAfter.classList.add('fade');
  };

  // 答案之书
  btnAns.onclick = () => {
    ansBox.textContent = book_answer(Math.random() * 2 ** 53);
    ansBox.classList.remove('hidden', 'fade');
    void ansBox.offsetWidth;
    ansBox.classList.add('fade');
    btnAns.textContent = '再 翻 一 次';
  };

  // 星座运势
  let cur = zodiac_index(M, D);
  const renderSigns = () => {
    signGrid.innerHTML = '';
    for (let i = 0; i < 12; i++) {
      const b = document.createElement('button');
      b.textContent = zodiac_name(i);
      if (i === cur) b.classList.add('on');
      b.onclick = () => { cur = i; renderSigns(); renderFortune(); };
      signGrid.appendChild(b);
    }
  };
  const renderFortune = () => {
    const f = JSON.parse(fortune_json(cur, Y, M, D));
    const row = (label, v) =>
      `<div class="row"><label>${label}</label><div class="bar"><i style="width:${v}%"></i></div><b>${v}</b></div>`;
    fScores.innerHTML = row('整体', f.overall) + row('爱情', f.love) + row('事业', f.career) + row('财运', f.wealth);
    fLucky.innerHTML = `幸运色 <em>${f.lucky_color}</em> · 幸运数字 <em>${f.lucky_number}</em><br>${f.guide}`;
    fortuneBox.classList.remove('hidden');
    fortuneBox.classList.add('fade');
  };
  renderSigns(); renderFortune();

  // 八字排盘
  bzDate.value = `${Y}-${pad(M)}-${pad(D)}`;
  let bzG = 1;
  bzGender.querySelectorAll('button').forEach(b => b.onclick = () => {
    bzG = Number(b.dataset.g);
    bzGender.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
  });
  btnBazi.onclick = () => {
    if (!bzDate.value) return;
    const [y, m, d] = bzDate.value.split('-').map(Number);
    const [hh, mm] = (bzTime.value || '12:00').split(':').map(Number);
    const z = JSON.parse(bazi_json(y, m, d, hh, mm, bzG));
    bzPillars.innerHTML = z.pillars.map((p, i) => `
      <div class="pillar ${i === 2 ? 'day' : ''}">
        <div class="pname">${p.name}${i === 2 ? ' · 日主' : ''}</div>
        <div class="ss">${p.shi_shen_gan}</div>
        <div class="gzchar serif">${p.gan}<br>${p.zhi}</div>
        <div class="hide">藏 ${p.hide_gan.join(' ')}<br>${p.na_yin} · ${p.di_shi}</div>
      </div>`).join('');
    bzMeta.innerHTML = `公历 ${z.solar} · 农历${z.lunar_text}<br>日主 <em>${z.day_gan}（${z.day_wuxing}）</em> · 胎元 ${z.tai_yuan} · 命宫 ${z.ming_gong} · 身宫 ${z.shen_gong}`;
    const maxC = Math.max(...z.wuxing.map(w => w.count), 1);
    bzWx.innerHTML = z.wuxing.map(w =>
      `<div class="row"><label>${w.name}</label><div class="bar"><i style="width:${Math.round(w.count / maxC * 100)}%"></i></div><b>${w.count}</b></div>`).join('')
      + `<div class="lucky">${z.missing.length ? '五行缺 ' + z.missing.join('、') : '五行俱全'} · 最旺 ${z.strongest}</div>`;
    bzYun.innerHTML = `大运${z.forward ? '顺行' : '逆行'} · ${z.start_desc}`;
    bzDayun.innerHTML = z.da_yun.map(dy =>
      `<div class="dy"><b class="serif">${dy.ganzhi}</b><span>${dy.start_age}–${dy.end_age} 岁</span><span>${dy.start_year}–${dy.end_year}</span></div>`).join('');
    baziBox.classList.remove('hidden');
    baziBox.classList.remove('fade'); void baziBox.offsetWidth; baziBox.classList.add('fade');
  };

  // 分享图（在浏览器本地用画布生成，不经服务器）
  const SERIF = '"Noto Serif SC","Songti SC","STSong",serif';
  const wrap = (ctx, text, maxW) => {
    const lines = []; let cur = '';
    for (const ch of text) {
      if (ctx.measureText(cur + ch).width > maxW) { lines.push(cur); cur = ch; } else cur += ch;
    }
    if (cur) lines.push(cur);
    return lines;
  };
  const newCard = (h) => {
    const c = document.createElement('canvas'); c.width = 750; c.height = h;
    const x = c.getContext('2d');
    x.fillStyle = '#f7f1e5'; x.fillRect(0, 0, 750, h);
    x.strokeStyle = '#a63d2f'; x.lineWidth = 3; x.strokeRect(24, 24, 702, h - 48);
    x.strokeStyle = '#e3d7bf'; x.lineWidth = 1; x.strokeRect(36, 36, 678, h - 72);
    x.textAlign = 'center';
    x.fillStyle = '#a63d2f'; x.font = `600 44px ${SERIF}`;
    x.fillText('玄 机', 375, 108);
    x.fillStyle = '#6f6659'; x.font = '24px sans-serif';
    x.fillText('民 俗 · 娱 乐', 375, 148);
    return [c, x];
  };
  const foot = (x, h) => {
    x.fillStyle = '#6f6659'; x.font = '23px sans-serif'; x.textAlign = 'center';
    x.fillText('xiaoyu-hue.github.io/xuanji', 375, h - 58);
  };
  const showShare = (canvas, box, name) => {
    const url = canvas.toDataURL('image/png');
    box.innerHTML = `<img src="${url}" alt="分享图"><br><a href="${url}" download="${name}">点此下载图片</a><p>手机上也可以长按图片保存</p>`;
    box.classList.remove('hidden'); box.classList.add('fade');
  };
  btnShareAlm.onclick = () => {
    if (!almData) return;
    const a = almData, [y, m, d] = almYMD;
    const [c, x] = newCard(1060);
    x.fillStyle = '#2e2a26'; x.font = `600 54px ${SERIF}`;
    x.fillText(a.lunar_text, 375, 238);
    x.fillStyle = '#6f6659'; x.font = '27px sans-serif';
    x.fillText(`${y} 年 ${m} 月 ${d} 日 · ${a.year_ganzhi}年 ${a.month_ganzhi}月 ${a.day_ganzhi}日 · 属${a.shengxiao}`, 375, 292);
    let yy = 372;
    x.textAlign = 'left'; x.font = '28px sans-serif';
    x.fillStyle = '#3f6f5f'; x.fillText('宜', 84, yy);
    x.fillStyle = '#2e2a26';
    for (const ln of wrap(x, a.yi.join(' · '), 560)) { x.fillText(ln, 140, yy); yy += 42; }
    yy += 18;
    x.fillStyle = '#a63d2f'; x.fillText('忌', 84, yy);
    x.fillStyle = '#2e2a26';
    for (const ln of wrap(x, a.ji.join(' · '), 560)) { x.fillText(ln, 140, yy); yy += 42; }
    yy += 26;
    x.font = '27px sans-serif'; x.fillStyle = '#2e2a26'; x.textAlign = 'center';
    const lines = [
      `值神 ${a.tianshen}（${a.tianshen_luck}） · 星宿 ${a.xiu}（${a.xiu_luck}）`,
      `冲煞 冲${a.chong} · 煞${a.sha}`,
      `财神位 ${a.cai} · 喜神位 ${a.xi} · 福神位 ${a.fu}`,
      `节气 ${a.prev_jieqi} → ${a.next_jieqi}`,
    ];
    for (const ln of lines) { x.fillText(ln, 375, yy); yy += 48; }
    foot(x, 1060);
    showShare(c, shareAlm, 'xuanji-almanac.png');
  };
  btnShareQian.onclick = () => {
    if (!lastQian) return;
    const q = lastQian;
    const [c, x] = newCard(1000);
    x.fillStyle = '#b8862f'; x.font = `600 32px ${SERIF}`;
    x.fillText(`第 ${q.id} 签 · ${q.grade}`, 375, 240);
    x.fillStyle = '#2e2a26'; x.font = `600 46px ${SERIF}`;
    q.poem.forEach((ln, i) => x.fillText(ln, 375, 350 + i * 78));
    x.fillStyle = '#6f6659'; x.font = '27px sans-serif';
    const jl = wrap(x, '解签：' + q.jie, 580);
    jl.forEach((ln, i) => x.fillText(ln, 375, 730 + i * 44));
    x.font = '24px sans-serif';
    x.fillText(`${Y} 年 ${M} 月 ${D} 日 · 今日一签`, 375, 730 + jl.length * 44 + 48);
    foot(x, 1000);
    showShare(c, shareQian, 'xuanji-qian.png');
  };
}

main().catch(e => {
  document.getElementById('loading').textContent = '黄历没翻开，请刷新重试';
  console.error(e);
});
</script>
