<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>玄机 · 今日</title>
<link rel="stylesheet" href="./style.css?v=3.0.0">
</head>
<body>
<header>
  <span class="seal serif">东方民俗</span>
  <h1 class="serif">玄 机</h1>
  <p id="todayLine">正在起卦…</p>
</header>

<div id="loading">🏮 正在翻开黄历…</div>

<main id="app" class="hidden">

  <!-- 今日黄历 -->
  <section class="card">
    <h2><span id="almTitle">今日黄历</span> <span class="sub" id="almSolar"></span></h2>
    <div class="daterow">
      <input type="date" id="datePick" min="1900-01-01" max="2100-12-31">
      <button id="btnToday">回到今天</button>
    </div>
    <div class="bigday">
      <div class="lunar serif" id="almLunar"></div>
      <div class="gz" id="almGz"></div>
    </div>
    <div class="yiji">
      <div class="box yi"><b>宜</b><div id="almYi"></div></div>
      <div class="box ji"><b>忌</b><div id="almJi"></div></div>
    </div>
    <div class="grid" id="almGrid"></div>
    <div class="pengzu" id="almPengzu"></div>
    <button class="btn ghost serif" id="btnShareAlm">生 成 黄 历 图</button>
    <div class="shareout hidden" id="shareAlm"></div>
  </section>
  <!-- 今日一签 -->
  <section class="card">
    <h2>今日一签 <span class="sub">同一天 · 同一签</span></h2>
    <div id="qianBefore">
      <p style="text-align:center;color:var(--ink2);font-size:13.5px;margin-top:10px">静心片刻，抽取属于今天的这一签</p>
      <button class="btn serif" id="btnQian">抽 今 日 签</button>
    </div>
    <div id="qianAfter" class="qian hidden">
      <span class="grade serif" id="qGrade"></span>
      <div class="poem serif" id="qPoem"></div>
      <div class="jie" id="qJie"></div>
      <button class="btn ghost serif" id="btnShareQian">生 成 签 文 图</button>
      <div class="shareout hidden" id="shareQian"></div>
    </div>
  </section>
  <!-- 答案之书 -->
  <section class="card">
    <h2>答案之书 <span class="sub">想好一个问题再翻开</span></h2>
    <div id="ansBox" class="answer serif hidden"></div>
    <button class="btn serif" id="btnAns">翻 开 答 案</button>
  </section>
  <!-- 八字排盘 -->
  <section class="card">
    <h2>八字排盘 <span class="sub">输入出生时间</span></h2>
    <div class="bzform">
      <div class="row2">
        <input type="date" id="bzDate" min="1900-01-01" max="2100-12-31">
        <input type="time" id="bzTime" value="12:00">
      </div>
      <div class="gender" id="bzGender">
        <button data-g="1" class="on">男</button>
        <button data-g="0">女</button>
      </div>
      <button class="btn serif" id="btnBazi" style="margin-top:2px">排 盘</button>
    </div>
    <div id="baziBox" class="hidden">
      <div class="pillars" id="bzPillars"></div>
      <div class="bzmeta" id="bzMeta"></div>
      <div class="scores" id="bzWx"></div>
      <div class="bzmeta" id="bzYun"></div>
      <div class="dayun" id="bzDayun"></div>
      <p style="font-size:12px;color:var(--ink2);text-align:center;margin-top:2px">八字属传统民俗文化内容，仅供娱乐参考</p>
    </div>
  </section>


</main>

<footer>
  玄机 · 民俗文化娱乐，不作决策依据<br>
  历法核心由 Rust 计算，结果与经典黄历库逐项核对
</footer>

<script type="module" src="./app.js?v=3.0.0"></script>
</body>
</html>
