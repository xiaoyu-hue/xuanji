[package]
name = "xuanji-core"
version = "2.1.0"
edition = "2021"

[lib]
name = "xuanji_core"
path = "src/lib.rs"

[[bin]]
name = "xuanji-demo"
path = "src/main.rs"

[dependencies]
lunar_rust = { git = "https://github.com/flameoftheforest/lunar_rust" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
